name: Deploy bio

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  # Only proceed if CI succeeded, then check whether bio actually changed
  changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      bio: ${{ steps.read.outputs.bio }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: changes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: read
        run: echo "bio=$(jq -r .bio changes.json)" >> "$GITHUB_OUTPUT"

  # bio depends on deeptime, ui
  preview:
    needs: changes
    if: needs.changes.outputs.bio == 'true' && github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ./.github/workflows/reusable-deploy-pr.yaml
    with:
      workspace: 'bio'
      target: 'bio'
      dependencies: '@nimbus-labs/deeptime,@nimbus-labs/ui'
      ref: ${{ github.event.workflow_run.head_sha }}
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
    secrets:
      firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIMBUS_LABORATORIES }}

  deploy:
    needs: changes
    if: needs.changes.outputs.bio == 'true' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-deploy-merge.yaml
    with:
      workspace: 'bio'
      target: 'bio'
      dependencies: '@nimbus-labs/deeptime,@nimbus-labs/ui'
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets:
      firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIMBUS_LABORATORIES }}
