name: Compsci App CI

on:
  push:
    branches:
      - 'main'
    paths:
      - 'app/compsci/**'
      - '.github/workflows/app-compsci-ci.yaml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'app/compsci/**'
      - '.github/workflows/app-compsci-ci.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check-format -w compsci
      - run: npm run lint -w compsci
      - run: npm run build -w compsci
      - run: npm test -w compsci
