name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/reusable-npm-ci.yaml'
      - '!**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/reusable-npm-ci.yaml'
      - '!**/*.md'

jobs:
  # Detect which packages have changes
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deeptime: ${{ steps.filter.outputs.deeptime }}
      ui: ${{ steps.filter.outputs.ui }}
      root: ${{ steps.filter.outputs.root }}
      bio: ${{ steps.filter.outputs.bio }}
      compsci: ${{ steps.filter.outputs.compsci }}
      geo: ${{ steps.filter.outputs.geo }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deeptime:
              - 'lib/deeptime/**'
              - 'package.json'
              - 'package-lock.json'
            ui:
              - 'lib/ui/**'
              - 'package.json'
              - 'package-lock.json'
            root:
              - 'app/root/**'
              - 'lib/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'firebase.json'
            bio:
              - 'app/bio/**'
              - 'lib/deeptime/**'
              - 'lib/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'firebase.json'
            compsci:
              - 'app/compsci/**'
              - 'lib/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'firebase.json'
            geo:
              - 'app/geo/**'
              - 'lib/deeptime/**'
              - 'lib/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'firebase.json'
      - name: Save changes
        run: |
          cat <<EOF > changes.json
          {
            "root": "${{ steps.filter.outputs.root }}",
            "bio": "${{ steps.filter.outputs.bio }}",
            "compsci": "${{ steps.filter.outputs.compsci }}",
            "geo": "${{ steps.filter.outputs.geo }}"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: changes.json
          retention-days: 1

  # Test deeptime library
  test-lib-deeptime:
    needs: detect-changes
    if: needs.detect-changes.outputs.deeptime == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    uses: ./.github/workflows/reusable-npm-ci.yaml
    with:
      workspace: '@nimbus-labs/deeptime'
      node-version: ${{ matrix.node-version }}

  # Test ui library
  test-lib-ui:
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    uses: ./.github/workflows/reusable-npm-ci.yaml
    with:
      workspace: '@nimbus-labs/ui'
      node-version: ${{ matrix.node-version }}

  # Test root portal app (depends on ui)
  test-app-root:
    needs: detect-changes
    if: needs.detect-changes.outputs.root == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    uses: ./.github/workflows/reusable-npm-ci.yaml
    with:
      workspace: 'root'
      dependencies: '@nimbus-labs/ui'
      node-version: ${{ matrix.node-version }}

  # Test bio app (depends on deeptime, ui)
  test-app-bio:
    needs: detect-changes
    if: needs.detect-changes.outputs.bio == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    uses: ./.github/workflows/reusable-npm-ci.yaml
    with:
      workspace: 'bio'
      dependencies: '@nimbus-labs/deeptime,@nimbus-labs/ui'
      node-version: ${{ matrix.node-version }}

  # Test compsci app (depends on ui)
  test-app-compsci:
    needs: detect-changes
    if: needs.detect-changes.outputs.compsci == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    uses: ./.github/workflows/reusable-npm-ci.yaml
    with:
      workspace: 'compsci'
      dependencies: '@nimbus-labs/ui'
      node-version: ${{ matrix.node-version }}

  # Test geo app (depends on deeptime, ui)
  test-app-geo:
    needs: detect-changes
    if: needs.detect-changes.outputs.geo == 'true'
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    uses: ./.github/workflows/reusable-npm-ci.yaml
    with:
      workspace: 'geo'
      dependencies: '@nimbus-labs/deeptime,@nimbus-labs/ui'
      node-version: ${{ matrix.node-version }}
