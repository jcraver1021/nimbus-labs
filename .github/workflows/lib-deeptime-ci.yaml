name: Deeptime Library CI

on:
  push:
    branches:
      - 'main'
    paths:
      - 'lib/deeptime/**'
      - '.github/workflows/lib-deeptime-ci.yaml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'lib/deeptime/**'
      - '.github/workflows/lib-deeptime-ci.yaml'
      - '!**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check-format -w @nimbus-labs/deeptime
      - run: npm run lint -w @nimbus-labs/deeptime
      - run: npm run build -w @nimbus-labs/deeptime
      - run: npm test -w @nimbus-labs/deeptime
